<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold/Bronze Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="50%" stop-color="#D4A36B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Silver/Blue Platter Gradient -->
    <linearGradient id="platterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bgGlow)"/>

  <g filter="url(#shadow)">
    <!-- Motion Speed Lines -->
    <path d="M 30 110 L 50 110 M 20 130 L 45 130 M 35 150 L 55 150" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

    <!-- Waiter Body Figure -->
    <!-- Head/Cap -->
    <ellipse cx="90" cy="52" rx="14" ry="14" fill="url(#goldGrad)"/>
    <!-- Waiter Cap -->
    <path d="M 76 50 C 76 38, 104 38, 104 50 Z" fill="#1E293B"/>
    <rect x="74" y="48" width="32" height="5" rx="2" fill="#D4A36B"/>

    <!-- Torso / Uniform -->
    <path d="M 72 70 L 108 70 L 102 125 L 78 125 Z" fill="#1E293B" stroke="#D4A36B" stroke-width="1"/>
    <!-- Tie / Bowtie -->
    <polygon points="90,72 85,84 90,88 95,84" fill="#D4A36B"/>

    <!-- Arms Holding Platter -->
    <path d="M 104 76 Q 130 82 145 74" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Legs Walking -->
    <path d="M 82 125 L 68 165 M 98 125 L 115 165" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>

    <!-- 3D Platter & Cover -->
    <g transform="translate(125, 42)">
      <!-- Tray -->
      <ellipse cx="30" cy="36" rx="28" ry="6" fill="url(#goldGrad)"/>
      <!-- Dome Cover -->
      <path d="M 8 34 C 8 10, 52 10, 52 34 Z" fill="url(#platterGrad)" stroke="#DBEAFE" stroke-width="1"/>
      <circle cx="30" cy="8" r="4" fill="url(#goldGrad)"/>
    </g>
  </g>
</svg>
