<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold/Bronze Dome Gradient -->
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Highlight Reflection -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Base Tray Gradient -->
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bgGlow)"/>

  <g filter="url(#shadow)">
    <!-- Tray Bottom Plate -->
    <ellipse cx="100" cy="148" rx="76" ry="14" fill="#3D1A04"/>
    <ellipse cx="100" cy="144" rx="72" ry="12" fill="url(#trayGrad)" stroke="#FCD34D" stroke-width="1"/>
    <ellipse cx="100" cy="142" rx="64" ry="9" fill="#2E1202"/>

    <!-- Serving Dome (Cloche Cover) -->
    <path d="M 28 140 C 28 65, 172 65, 172 140 Z" fill="url(#domeGrad)" stroke="#FDE68A" stroke-width="1.5"/>

    <!-- Specular Highlight Arc -->
    <path d="M 45 130 C 50 85, 120 75, 145 78 C 120 72, 50 82, 45 130 Z" fill="url(#shineGrad)"/>

    <!-- Dome Rim Border -->
    <ellipse cx="100" cy="140" rx="72" ry="10" fill="none" stroke="#FDE68A" stroke-width="2.5"/>

    <!-- Top Handle Knob -->
    <rect x="94" y="52" width="12" height="12" rx="3" fill="url(#domeGrad)" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="100" cy="48" r="11" fill="url(#domeGrad)" stroke="#FFF" stroke-width="1"/>
    <circle cx="97" cy="44" r="3" fill="#FFF" opacity="0.7"/>
  </g>
</svg>
