<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4A36B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Leather Pad Gradient -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A86B32"/>
      <stop offset="50%" stop-color="#7A451A"/>
      <stop offset="100%" stop-color="#4A260B"/>
    </linearGradient>

    <!-- Clip Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D7B2"/>
      <stop offset="50%" stop-color="#D4A36B"/>
      <stop offset="100%" stop-color="#854E1F"/>
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EE"/>
      <stop offset="100%" stop-color="#EEDCBF"/>
    </linearGradient>

    <!-- Green Check Badge -->
    <linearGradient id="greenBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bgGlow)"/>

  <g filter="url(#shadow)">
    <!-- Leather Clipboard Base -->
    <rect x="42" y="32" width="96" height="136" rx="14" fill="url(#leatherGrad)" stroke="#C59A62" stroke-width="1.5"/>
    
    <!-- Paper Sheet -->
    <rect x="50" y="48" width="80" height="110" rx="6" fill="url(#paperGrad)"/>

    <!-- Checklist Lines -->
    <!-- Line 1 -->
    <rect x="58" y="66" width="12" height="12" rx="3" fill="#D4A36B"/>
    <path d="M61 72 l2 2 l4 -4" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="76" y1="72" x2="118" y2="72" stroke="#8C7053" stroke-width="3" stroke-linecap="round"/>

    <!-- Line 2 -->
    <rect x="58" y="88" width="12" height="12" rx="3" fill="#D4A36B"/>
    <path d="M61 94 l2 2 l4 -4" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="76" y1="94" x2="114" y2="94" stroke="#8C7053" stroke-width="3" stroke-linecap="round"/>

    <!-- Line 3 -->
    <rect x="58" y="110" width="12" height="12" rx="3" fill="#D4A36B"/>
    <path d="M61 116 l2 2 l4 -4" stroke="#FFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <line x1="76" y1="116" x2="108" y2="116" stroke="#8C7053" stroke-width="3" stroke-linecap="round"/>

    <!-- Top Metal Clip -->
    <rect x="70" y="26" width="40" height="18" rx="5" fill="url(#goldGrad)" stroke="#FFF" stroke-width="0.5"/>
    <circle cx="90" cy="35" r="4" fill="#3D2008"/>

    <!-- 3D Gold Desk Bell on Right -->
    <g transform="translate(112, 105)">
      <!-- Bell Base -->
      <ellipse cx="28" cy="42" rx="26" ry="6" fill="#4A260B"/>
      <ellipse cx="28" cy="40" rx="24" ry="5" fill="url(#goldGrad)"/>
      <!-- Bell Dome -->
      <path d="M6 40 C 6 16, 50 16, 50 40 Z" fill="url(#goldGrad)" stroke="#FFE8CD" stroke-width="0.5"/>
      <!-- Top Plunger -->
      <rect x="25" y="10" width="6" height="8" rx="2" fill="url(#goldGrad)"/>
      <circle cx="28" cy="9" r="5" fill="url(#goldGrad)" stroke="#FFF" stroke-width="0.5"/>
    </g>
  </g>
</svg>
