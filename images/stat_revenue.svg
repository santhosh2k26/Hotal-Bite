<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Side Coin Rim Gradient -->
    <linearGradient id="coinSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="200" height="200" fill="url(#bgGlow)"/>

  <g filter="url(#shadow)" transform="translate(10, 0)">
    <!-- Left Stack of Gold Coins -->
    <!-- Coin 1 (Bottom) -->
    <path d="M 40 140 v 10 a 24 8 0 0 0 48 0 v -10 Z" fill="url(#coinSide)"/>
    <ellipse cx="64" cy="140" rx="24" ry="8" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="0.5"/>

    <!-- Coin 2 -->
    <path d="M 40 128 v 10 a 24 8 0 0 0 48 0 v -10 Z" fill="url(#coinSide)"/>
    <ellipse cx="64" cy="128" rx="24" ry="8" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="0.5"/>

    <!-- Coin 3 -->
    <path d="M 40 116 v 10 a 24 8 0 0 0 48 0 v -10 Z" fill="url(#coinSide)"/>
    <ellipse cx="64" cy="116" rx="24" ry="8" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="0.5"/>

    <!-- Coin 4 (Top) -->
    <path d="M 40 104 v 10 a 24 8 0 0 0 48 0 v -10 Z" fill="url(#coinSide)"/>
    <ellipse cx="64" cy="104" rx="24" ry="8" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="0.8"/>

    <!-- Right Large Rupee Coin Badge -->
    <g transform="translate(105, 75)">
      <!-- Coin Edge 3D -->
      <path d="M 0 35 v 10 a 35 35 0 0 0 70 0 v -10 Z" fill="url(#coinSide)"/>
      <circle cx="35" cy="35" r="35" fill="url(#coinGrad)" stroke="#FEF08A" stroke-width="2"/>
      <circle cx="35" cy="35" r="30" fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-dasharray="4,2"/>
      
      <!-- Rupee Symbol ₹ -->
      <text x="35" y="46" font-family="'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" filter="drop-shadow(0 2px 4px #451A03)">₹</text>
    </g>
  </g>
</svg>
