<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#60A5FA" stroke-width="2"/>

  <g filter="url(#shadow)" transform="translate(18, 18)">
    <!-- 3D History Clock -->
    <circle cx="32" cy="32" r="26" fill="url(#goldGrad)" stroke="#DBEAFE" stroke-width="2"/>
    <path d="M 32 16 V 32 L 42 42" stroke="#172554" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Circular Arrow -->
    <path d="M 12 32 A 20 20 0 1 1 32 52" stroke="#FFF" stroke-width="3" stroke-linecap="round" fill="none" stroke-dasharray="30,8"/>
  </g>
</svg>
