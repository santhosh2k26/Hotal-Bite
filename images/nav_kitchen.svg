<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#FB923C" stroke-width="2"/>

  <g filter="url(#shadow)" transform="translate(16, 16)">
    <!-- Chef Hat -->
    <path d="M 22 36 C 14 36, 12 22, 24 18 C 26 8, 42 8, 44 18 C 54 12, 58 26, 46 36 Z" fill="url(#goldGrad)"/>
    <rect x="22" y="34" width="24" height="10" rx="3" fill="#FFF8EE"/>
    <!-- Flame Below -->
    <path d="M 34 60 C 24 60, 20 48, 34 44 C 40 40, 48 48, 44 54 C 48 54, 44 60, 34 60 Z" fill="#FDE047"/>
  </g>
</svg>
